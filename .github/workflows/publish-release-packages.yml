name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

# The coordinator needs contents:write to attach release assets; a called
# workflow may not exceed the caller's grant, so the ceiling is set here.
# id-token:write is granted only to the pypi job below, the one job that
# uses it.
permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install . numpy
      - run: python tests/parity/verify_acceptance.py
      - run: python tests/parity/verify_effects.py
      - run: python tests/parity/verify_streaming.py
      - run: python tests/parity/verify_biquad.py
      - run: python tests/parity/verify_mixdown_knee.py
      # See the note in test-cpython.yml: this gate was missing everywhere, so
      # The DSP nodes' gate is cross-interpreter agreement (verify_dsp, in
      # clean-build.yml, which builds the second interpreter). A release job has
      # one interpreter, so it checks the thing one interpreter can check: that
      # every probe runs.
      - name: Every DSP probe runs
        shell: bash
        run: |
          set -e
          for probe in tests/parity/*_probe.py; do
            python "$probe" >/dev/null || { echo "probe failed: $probe" >&2; exit 1; }
          done
          echo "every probe ran"

  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm inherited TestPyPI credentials
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [[ -z "$TESTPYPI_API_TOKEN" ]]; then
            echo "TESTPYPI_API_TOKEN is unavailable; ensure the organization secret is visible to PyDevices/audiodsp." >&2
            exit 1
          fi

  publish:
    needs:
      - parity
      - credentials
    # publishing-vNEXT is a placeholder for the first publishing tag cut after
    # PyDevices/.github's caller-side PyPI change (the coordinator's pypi-gate
    # job and its pypi-publish / dist-artifact / version outputs). Replace it
    # with that tag's real name before merging; as written, a run fails at
    # startup.
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-vNEXT
    with:
      build-kind: native-and-wasm
      distribution-name: pydevices-audiodsp
      # No mip-profile: nothing here is MIP-published any more. The native
      # modules are firmware -- MicroPython and CircuitPython build them from
      # src/ as a usermod, so there is nothing for MIP to carry -- and
      # audiorender needs numpy and renders a whole composition in memory,
      # which is a desktop's job. The instrument and effect libraries this
      # profile used to carry publish from PyDevices/audiocomponents now.
      # 18: twelve desktop wheels (cp311-cp314 on manylinux x86_64, win_amd64
      # and macosx_arm64), four Android (cp313, cp314 on arm64_v8a and x86_64)
      # and two wasm (cp313, cp314). It was 21 until Python 3.10 was dropped
      # on 2026-09-10 (5bdd3e9): cibuildwheel filters its selector by
      # requires-python, so the three cp310 wheels stopped being built, and
      # this number did not follow. The first release afterwards, v0.5.0,
      # tagged and then published nothing (#122).
      expected-wheel-count: 18
      wheel-filename-prefix: pydevices_audiodsp
      # Production PyPI too, for final releases (Brad, 2026-09-23): the name
      # was parked at 0.6.0 by mirroring TestPyPI's files, and its Trusted
      # Publisher (this workflow, environment "pypi") is configured. The
      # coordinator only decides; the upload is the pypi job below.
      pypi-publish: true
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

  pypi:
    # The upload has to run here, in this file. PyPI matches the Trusted
    # Publisher against the workflow that runs the upload job, and when that
    # job lived in the reusable coordinator, the workflow was
    # PyDevices/.github's, not this one: v0.6.1 failed with invalid-publisher.
    # The pypi environment requires Brad's approval and allows v* tags only.
    needs: publish
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.dist-artifact }}
          path: dist
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  report-pypi:
    # The coordinator's Release Health report went out before this upload,
    # with pypi "pending"; this fills in the outcome on the same row.
    needs:
      - publish
      - pypi
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    # Same placeholder as the publish job above: the same tag, both lines.
    uses: PyDevices/.github/.github/workflows/reusable-report-pypi-result.yml@publishing-vNEXT
    with:
      distribution-name: pydevices-audiodsp
      version: ${{ needs.publish.outputs.version }}
      pypi-result: ${{ needs.pypi.result }}
    secrets: inherit
