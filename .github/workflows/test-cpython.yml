name: Test CPython

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (Apple Silicon) delivers the org macOS posture:
        # everything CI can prove — build, import, unit tests, parity —
        # runs on the macOS runner too.
        #
        # ubuntu-24.04-arm is the same posture for aarch64, and it is the
        # SBC story: Raspberry Pi OS 64-bit is aarch64. A native ARM runner
        # rather than QEMU, so the parity suite actually executes on the
        # architecture the wheels target — the class of bug worth catching
        # here is arithmetic that differs by architecture, which emulation
        # would reproduce faithfully only by accident.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build numpy twine
      - run: python -m build
      - run: python -m twine check dist/*
      - shell: bash
        run: python -m pip install dist/*.whl
      # test_*.py, not test_cpython_*.py: the narrower pattern once silently
      # excluded every test without the prefix. Nothing here needs more than
      # the wheel and numpy: the instrument and effect libraries, and the
      # component-contract tests and validators that went with them, live in
      # PyDevices/audiocomponents now.
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python tests/parity/verify_acceptance.py
      # The CPython half of the deinit surface (the native half runs in
      # clean-build.yml, on a real MicroPython build). The planted fault runs
      # first and must fail.
      - name: The deinit surface, and proof the probe can fail
        # Explicit, because this matrix includes windows-latest, where the
        # default shell is PowerShell and `if ...; then` is a parse error.
        shell: bash
        run: |
          if python tests/parity/deinit_surface_probe.py --fault; then
            echo "the planted fault passed, so this probe proves nothing" >&2
            exit 1
          fi
          python tests/parity/deinit_surface_probe.py
      - run: python tests/parity/verify_effects.py
      - run: python tests/parity/verify_streaming.py
      - run: python tests/parity/verify_biquad.py
      - run: python tests/parity/verify_mixdown_knee.py
      # The DSP nodes' real gate is cross-interpreter agreement and it needs
      # two interpreters, so it lives in clean-build.yml where a MicroPython
      # binary is built. A one-interpreter run cannot fail and verify_dsp now
      # refuses one (docs/correctness-standard.md).
      #
      # What this matrix can say is worth having and is not a comparison: every
      # probe RUNS, on four operating systems and five Pythons. That catches an
      # import error, a crash, or an arithmetic assumption that only holds on
      # x86_64 - none of which the Linux-only agreement run would see.
      - name: Every DSP probe runs under this interpreter
        shell: bash
        run: |
          set -e
          for probe in tests/parity/*_probe.py; do
            python "$probe" >/dev/null || { echo "probe failed: $probe" >&2; exit 1; }
          done
          echo "every probe ran"

  # Non-publishing proof of the macOS wheel claim: run the same cibuildwheel
  # the release path uses (pypa/cibuildwheel, [tool.cibuildwheel] in
  # pyproject.toml) on macos-latest, compiling the native extension for
  # cp311–cp314 arm64 and running the configured import/smoke test-command
  # in each wheel. Nothing is uploaded anywhere. Release wheels still come
  # from the org reusable workflow; this job proves they would build.
  macos-wheels:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build macOS wheels (no publish)
        uses: pypa/cibuildwheel@v4.2.0
      - run: ls -l wheelhouse/

  # The same non-publishing proof for Linux aarch64, on a native ARM
  # runner. This job is currently the ONLY thing that builds an ARM wheel:
  # the org release matrix (reusable-build-native-and-wasm-wheels.yml, at
  # publishing-v8) runs ubuntu-latest, windows-latest and macos-latest, so
  # releases still ship no aarch64 wheel. See docs/building-wheels.md for
  # what closing that gap costs. Proving the build here first means the org
  # change, when it comes, is a matrix line rather than a discovery.
  linux-arm-wheels:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # No CIBW_ARCHS override: pyproject's auto64 already resolves to
      # aarch64 on this runner, which is the property that makes the org
      # matrix change a one-line addition.
      - name: Build Linux aarch64 wheels (no publish)
        uses: pypa/cibuildwheel@v4.2.0
      - run: ls -l wheelhouse/

  # The `[render]` extra, which no other job installs (audiodsp#35). The test
  # job above installs numpy by hand *before* the wheel, so a typo in the
  # extra's name - or a future edit that drops it - would go unnoticed while
  # every test stayed green.
  #
  # Both directions are asserted, because only the pair is evidence. A bare
  # install must NOT bring numpy, or "numpy is importable" says nothing about
  # the extra; and `pip install wheel[misspelled]` *succeeds* with only a
  # warning, so the extra's work is proved by numpy arriving, not by pip's
  # exit code. Fresh venvs, since this runner's Python has numpy in it.
  render-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: the [render] extra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: A bare install brings no numpy
        shell: bash
        run: |
          python -m venv bare
          ./bare/bin/python -m pip install dist/*.whl
          if ./bare/bin/python -c "import numpy" 2>/dev/null; then
            echo "a bare install pulled numpy in, so the [render] check below proves nothing" >&2
            exit 1
          fi
          ./bare/bin/python -c "import audiocore, synthio; print('bare install imports the nodes')"
      - name: The [render] install brings numpy and audiorender
        shell: bash
        run: |
          python -m venv render
          ./render/bin/python -m pip install "$(echo dist/*.whl)[render]"
          ./render/bin/python -c "
          import numpy, audiorender
          from audiorender import events, tempo, wav
          print('[render] extra OK: numpy', numpy.__version__)"
