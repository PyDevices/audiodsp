# Scenario S1: a stranger builds audiodsp from this repository, upstream
# MicroPython, and the declared pinned dependencies -- no parent workspace
# of any kind. This is the standalone contract's proof, run on every push.
name: Clean standalone build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-usermod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # double is the unix port's default; float mirrors single-precision
        # MCU targets (ESP32-P4/RP2040), where mp_float_t is 32-bit -- the
        # class of bug 55c275a fixed (a float*/double* pointer mismatch)
        # is invisible to the double cell. mpconfigvariant_common.h only
        # #ifndef-defaults MICROPY_FLOAT_IMPL, so a CFLAGS define overrides
        # it without touching any build script.
        #
        # This cell runs at the unix port's full -Werror, including
        # -Wfloat-conversion and -Wdouble-promotion, which MCU ports do not
        # enable. It used to downgrade those two to warnings, because
        # audiodsp's sources carried double literals that narrowed under a
        # 32-bit mp_float_t; the four sites were cleaned in the commit that
        # removed the downgrades. Keeping them as errors is the point of the
        # cell: a real precision loss, or an accidental promotion to double
        # inside a board's audio loop, now stops the build instead of
        # scrolling past in a green log.
        float-impl:
          - name: double
            cflags: ""
            known-divergent: ""
          - name: float
            cflags: -DMICROPY_FLOAT_IMPL=MICROPY_FLOAT_IMPL_FLOAT
            # Two left of the six #80 found, and both are below the probes:
            # #101 (synthio.Biquad derives W0 in mp_float_t where the CPython
            # extension uses the shared double helper) and #102 (a filtered
            # Echo's per-sample arithmetic is mp_float_t in C and double in the
            # twin). Each moves board digests, so each is its own change.
            # The double cell has no exceptions and must not gain any.
            # Bounded since 2026-09-22 (decision 4): each may differ on at
            # most the four output lines measured on this build, and the run
            # fails if either grows, stops diverging, or anything else
            # diverges at all. An accepted difference nobody has measured is
            # indistinguishable from a new defect.
            known-divergent: >-
              --known-divergent biquad_component_probe.py:4
              --known-divergent echo_filter_probe.py:4
    name: unix-usermod (${{ matrix.float-impl.name }}-precision)
    steps:
      - uses: actions/checkout@v7
        with:
          path: audiodsp
      - name: Fetch pinned dependencies
        working-directory: audiodsp
        run: |
          ./scripts/fetch_deps.sh
          ./scripts/fetch_deps.sh --check
      # v1.29.0 since the workspace pin moved there on 2026-09-09; this
      # step said v1.28.0 until then, so the standalone build was proved
      # against an interpreter the org no longer runs.
      - name: Check out upstream MicroPython v1.29.0
        uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: v1.29.0
          path: micropython
      - name: Build the unix port with the audiodsp usermod
        # USER_C_MODULES is the PARENT directory: py.mk globs
        # $(USER_C_MODULES)/*/micropython.mk exactly one level down.
        run: |
          make -C micropython/mpy-cross -j2
          make -C micropython/ports/unix submodules
          make -C micropython/ports/unix -j2 \
            USER_C_MODULES=$GITHUB_WORKSPACE \
            CFLAGS_EXTRA="${{ matrix.float-impl.cflags }}"
      - name: Smoke the result
        run: |
          ./micropython/ports/unix/build-standard/micropython -c "
          import audiocore, synthio, audiomixer, audiofilters, audiodelays
          import audiomp3, audiodynamics, audioroute, audiomath, audioecho
          import audiofreeverb, audiospeed, audioconvolve, audioshaper
          import ulab.numpy as np
          s = synthio.Synthesizer(sample_rate=8000); s.press(69)
          r, b = audiocore.get_buffer(s)
          assert r == 1 and len(b) == 512
          print('standalone audiodsp OK:', len(b), 'bytes of synth output')"
      # The DSP nodes' real gate: every interpreter must render them
      # identically, which needs two interpreters, which is why it lives here
      # and not in test-cpython.yml. There is no stored digest to match - the
      # comparison IS the gate (docs/correctness-standard.md) - and verify_dsp
      # refuses a run with fewer than two interpreters rather than passing one
      # that cannot fail.
      #
      # CircuitPython is not built in CI, so this is the two-way; the three-way
      # including the patched CircuitPython build is a local run.
      # The float cell diverges on two probes because mp_float_t is 32-bit
      # there and CPython's is not -- #101 and #102, both named above. It was
      # six until #80 fixed the four whose cause was in the probes themselves.
      # --known-divergent narrows the gate to exactly those two rather than
      # switching it off: a third probe diverging still fails, and so does
      # either of these starting to agree, which is what stops the exception
      # outliving its reason. Delete the flag when both close; the gate will
      # tell you if you forget.
      - name: Every target renders the DSP nodes identically
        run: |
          cd audiodsp
          python3 -m venv .ci-venv
          ./.ci-venv/bin/python -m pip install -q .
          ./.ci-venv/bin/python tests/parity/verify_dsp.py \
            --micropython "$GITHUB_WORKSPACE/micropython/ports/unix/build-standard/micropython" \
            ${{ matrix.float-impl.known-divergent }}

      # The native half of the deinit surface. Nothing else in CI runs on a
      # MicroPython build, and this is the gate for #58/#59/#60/#63: every
      # node type releases, and every way back into the audio path raises
      # afterwards instead of returning stale audio or reading freed memory.
      # `--fault` is run first and must FAIL: a probe whose failing mode is
      # never exercised is not a gate.
      - name: The deinit surface, and proof the probe can fail
        # Paths are workspace-root relative here, not repo-root: this job
        # checks the repo out to `audiodsp/` and puts upstream MicroPython
        # beside it.
        run: |
          MP=./micropython/ports/unix/build-standard/micropython
          PROBE=audiodsp/tests/parity/deinit_surface_probe.py
          if MICROPYPATH=audiodsp "$MP" "$PROBE" --fault; then
            echo "the planted fault passed, so this probe proves nothing" >&2
            exit 1
          fi
          MICROPYPATH=audiodsp "$MP" "$PROBE"

      # The pump. Everything above proves the DSP nodes; these prove the
      # thing that pulls them, and they can only run here, because they
      # need a MicroPython build and this is the job that makes one.
      #
      # No platform driver is needed. `audiopump` the engine ships with this
      # repository on every port; the driver is a separate repo, and without
      # one `threaded()` is False and the same loop runs on the
      # interpreter's own thread -- which is what the `driver` case checks.
      #
      # Every fault is run FIRST and must fail. A probe whose failing mode
      # is never exercised is not a gate, which is the same rule the deinit
      # surface above is run under.
      - name: The pump's gates, and proof each one can fail
        run: |
          MP=./micropython/ports/unix/build-standard/micropython
          run () {                       # run <probe> <args...>
            MICROPYPATH=audiodsp PUMP_PROBE_TMP="${RUNNER_TEMP:-/tmp}" \
              "$MP" -X heapsize=256M "audiodsp/tests/pump/$@"
          }
          for planted in "pump_probe.py identity --fault short" \
                         "pump_probe.py identity --fault reuse" \
                         "pump_probe.py alloc --fault alloc" \
                         "pump_probe.py storm --fault stall" \
                         "pump_probe.py unpumpable --fault unpumpable" \
                         "route_probe.py ring --fault flip" \
                         "route_probe.py events --fault drop" \
                         "route_probe.py tap --fault short" \
                         "route_probe.py port --fault latch" \
                         "route_probe.py deep_loop --fault deeper" \
                         "route_probe.py refused --fault deaf"; do
            if run $planted > /dev/null; then
              echo "the planted fault passed: $planted" >&2
              exit 1
            fi
          done
          run pump_probe.py
          run route_probe.py

  # Scenario S2: the *CMake* half of the standalone contract. Until this job
  # existed nothing in CI ran CMake at all - clean-build built through
  # micropython.mk only - so an edit to micropython.cmake, or to the README's
  # CMake recipe, could break the standalone CMake path exactly as it had been
  # broken before, and every workflow would stay green (audiodsp#35).
  #
  # Configure only: no compiler, no firmware, seconds to run. The harness in
  # tests/cmake drives MicroPython's own py/usermod.cmake the way a port does
  # and then asserts what that must have produced - both usermod targets, the
  # link into `usermod`, every named source present on disk, and the voice
  # ceiling defined.
  cmake-configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: cmake configure (standalone)
    steps:
      - uses: actions/checkout@v7
        with:
          path: audiodsp
      # ulab is not optional here: `usermod_ulab` is the target that had
      # actually broken once, so the harness treats its absence as a failure.
      - name: Fetch pinned dependencies
        working-directory: audiodsp
        run: |
          ./scripts/fetch_deps.sh
          ./scripts/fetch_deps.sh --check
      - name: Check out upstream MicroPython v1.29.0
        uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: v1.29.0
          path: micropython
      - name: Configure the usermod through CMake
        run: |
          cmake -S audiodsp/tests/cmake -B cmake-build \
                -DMICROPY_DIR="$GITHUB_WORKSPACE/micropython" \
                -DUSER_C_MODULES="$GITHUB_WORKSPACE/audiodsp"
