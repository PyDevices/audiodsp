# The modules' type stubs. mypy reads every .pyi under src/ and lib/, so a stub
# that doesn't parse or contradicts itself fails here and not in your editor.
# stubtest then imports the module from a wheel built from this checkout and
# compares it with its stub: a parameter the stub makes positional that the
# module takes by keyword, a default that differs, a method the stub lacks.
# tools/check_bindings.py holds each stub to the C bindings MicroPython builds,
# read from the sources, so between the two checks a call that works on one
# interpreter and raises on the other fails here.
# Runs when a stub, a binding, a CPython wrapper or this file changes. That a stub names
# what its module exports is checked by tests/test_stubs_match_modules.py in
# the unit job.
name: Stubs

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'tools/check_bindings.py'
      - 'src/**/*.pyi'
      - 'lib/**/*.pyi'
      - 'src/cpython/**'
      - 'tools/check_stubtest.py'
      - 'tools/stubs/**'
      - '.github/workflows/stubs.yml'
  pull_request:
    paths:
      - 'src/**/*.c'
      - 'tools/check_bindings.py'
      - 'src/**/*.pyi'
      - 'lib/**/*.pyi'
      - 'src/cpython/**'
      - 'tools/check_stubtest.py'
      - 'tools/stubs/**'
      - '.github/workflows/stubs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install mypy
      # One module's stubs at a time: two modules may each ship an `image.pyi`.
      - name: mypy over each module's stubs
        run: |
          status=0
          for dir in $(find src -name '*.pyi' -printf '%h\n' | sort -u); do
            echo "== $dir"
            (cd "$dir" && python -m mypy --no-incremental ./*.pyi) || status=1
          done
          exit $status
      - name: mypy over the pure-Python packages' stubs
        run: cd lib && python -m mypy --no-incremental -p audiorender -p audiodsp_util
      # Each stub against the MicroPython C bindings, read from the sources.
      - name: stubs against the MicroPython bindings
        run: python tools/check_bindings.py

  stubtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install mypy numpy
      # The wheel is what a user installs, so it is what the stubs are held to.
      - run: python -m pip install .
      # tools/stubs/stubtest_allowlist.txt names every difference stubtest is
      # allowed to find, and says why. Anything else fails, and so does an entry
      # that no longer matches.
      - run: python tools/check_stubtest.py
